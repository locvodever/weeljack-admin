<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to content</a>
<header class="header">
  <app-topbar />
</header>
<div class="body" [class.docked]="layout.dockedVisible()">
  @if (layout.dockedVisible()) {
    <app-sidebar id="docked-nav" class="side" idPrefix="docked" />
  }
  <main id="main" tabindex="-1">
    <router-outlet />
  </main>
</div>
<footer class="footer">
  <p>weeljack-admin is a free template released under the MIT licence.</p>
</footer>
@defer (when layout.drawerRequested()) {
  <app-menu-drawer />
}
